function padSt(g){const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0,ay=g.axes[1]||0;return{l:b(14)||ax<-.4,r:b(15)||ax>.4,u:b(12)||ay<-.55,d:b(13)||ay>.55,j:b(0),a:b(2)||b(1),f:b(4)||b(5)||b(6)||b(7),tri:b(3),op:b(9),sh:b(8)||b(17)}}
function pollPad(){const pads=[];try{for(const q of (navigator.getGamepads?navigator.getGamepads():[]))if(q&&q.connected)pads.push(q)}catch(e){}
PADON=pads.length;PADG=pads[0]||null;PADS=pads;if(document.body.classList.contains('pad')!==(PADON>0))document.body.classList.toggle('pad',PADON>0);if(pads.some(g=>g.buttons.some(x=>x.pressed)))startAudio();

if(s2.tri&&!PS2.tri&&st=='play'&&PLS[1]&&PLS[1].ab&&!PLS[1].dead){const o=P;P=PLS[1];snd('drop');dropAb();P=o}PS2.tri=s2.tri;

if(st=='title'&&NP==2){const g=pads[1]||pads[0];if(g){const bt=i=>!!(g.buttons[i]&&g.buttons[i].pressed),up=pads[1]?(bt(12)||(g.axes[1]||0)<-.55):bt(4),dn=pads[1]?(bt(13)||(g.axes[1]||0)>.55):bt(5);if(up&&!PS2.hu)cycHat2(-1);if(dn&&!PS2.hd)cycHat2(1);PS2.hu=up;PS2.hd=dn}}
const op=pads.some(g=>g.buttons[9]&&g.buttons[9].pressed);if(op&&!PS.op){if(st=='title'){NP=NP%4+1;snd('menu')}else togglePause()}PS.op=op;
const sh=s1.sh||s2.sh;if(sh&&!PS.sh){key('c',1);key('c',0)}PS.sh=sh}
